version: '3.8'

services:
  mbtiserver:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mbti-server
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DOUBAO_API_KEY=${DOUBAO_API_KEY}
      - DOUBAO_MODEL=doubao-seed-1.8-high
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 前端服务（可选）
  doubao-app:
    build:
      context: ../doubao_app
      dockerfile: Dockerfile
    container_name: doubao-app
    ports:
      - "3000:80"
    depends_on:
      - mbtiserver
    environment:
      - VITE_API_BASE=http://mbtiserver:8080/api
    restart: unless-stopped

networks:
  default:
    name: mbti-network
